<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tide Runner</title>
<style>html,body{margin:0;height:100%;background:#06101f;overflow:hidden}canvas{display:block;width:100vw;height:100vh;cursor:crosshair}</style>
</head><body><canvas id="c"></canvas><script>
'use strict';
// TIDE RUNNER: jet ski over procedural islands. Voxel Space heightmap renderer on a 2D canvas, no engine, no polygons.
const W=400,H=225,W2=200,H2=112,N=1024,M=1023,WL=20,D=620,TAU=Math.PI*2,PI=Math.PI;
const $=document.getElementById('c'),ctx=$.getContext('2d');
const layer=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),d=x.createImageData(W,H);return{c,x,d,w:W,h:H,b:new Uint32Array(d.data.buffer)}};
const SCN=layer(),HUD=layer(),buf=SCN.b,dep=new Float32Array(W*H),yb=new Int32Array(W);
// URL modes: #shot=cam,sec (screenshot), #rec (frame-by-frame lap capture), #poster (staged key-art frame)
const REC=/rec/.test(location.hash),POSTER=/poster/.test(location.hash);
const mkS=(w,h)=>({w,h,b:new Uint32Array(w*h)});

// ---------- math / color
let sd=20261116;
const rnd=()=>{sd=sd+0x6D2B79F5|0;let t=Math.imul(sd^sd>>>15,1|sd);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const cl=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,ss=t=>t*t*(3-2*t);
const wd=d=>d-N*Math.round(d/N),ad=a=>Math.atan2(Math.sin(a),Math.cos(a));
const rgb=(r,g,b)=>(0xff000000|cl(b,0,255)<<16|cl(g,0,255)<<8|cl(r,0,255))>>>0;
const rgba=(r,g,b,a)=>(a<<24|b<<16|g<<8|r)>>>0;
const hx=s=>{const n=parseInt(s,16);return rgb(n>>16,n>>8&255,n&255)};
const mixc=(a,b,t)=>rgb(lerp(a&255,b&255,t),lerp(a>>8&255,b>>8&255,t),lerp(a>>16&255,b>>16&255,t));
const shd=(c,f)=>rgb((c&255)*f,(c>>8&255)*f,(c>>16&255)*f);

// ---------- tileable value noise (map wraps, so every layer has period N)
const hs=(x,y)=>{let h=Math.imul(x,374761393)+Math.imul(y,668265263)|0;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296};
function vn(x,y,p){const ix=Math.floor(x),iy=Math.floor(y),fx=ss(x-ix),fy=ss(y-iy),a=(ix%p+p)%p,b=(iy%p+p)%p,c=(a+1)%p,d=(b+1)%p;
 return lerp(lerp(hs(a,b),hs(c,b),fx),lerp(hs(a,d),hs(c,d),fx),fy)}
function fbm(x,y,o,f){let v=0,a=1,t=0;for(let i=0;i<o;i++,a*=.5,f*=2){v+=vn(x*f,y*f,N*f)*a;t+=a}return v/t}

// ---------- pixel drawing on any surface {w,h,b}
const ps=(S,x,y,c)=>{x|=0;y|=0;if(x>=0&&y>=0&&x<S.w&&y<S.h)S.b[y*S.w+x]=c};
const rf=(S,x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++)ps(S,x+i,y+j,c)};
function dc(S,x,y,r,c){x=Math.round(x);y=Math.round(y);const R=Math.ceil(r);for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++)if(i*i+j*j<=r*r+r*.8)ps(S,x+i,y+j,c)}
function ln(S,x0,y0,x1,y1,r,c){const n=Math.max(1,Math.hypot(x1-x0,y1-y0)*(r>1?.6:1.5)|0);for(let k=0;k<=n;k++){const x=lerp(x0,x1,k/n),y=lerp(y0,y1,k/n);r?dc(S,x,y,r,c):ps(S,x,y,c)}}
function tri(S,a,b,c,col){const e=(p,q,x,y)=>(q[0]-p[0])*(y-p[1])-(q[1]-p[1])*(x-p[0]);
 for(let y=Math.floor(Math.min(a[1],b[1],c[1]));y<=Math.max(a[1],b[1],c[1]);y++)for(let x=Math.floor(Math.min(a[0],b[0],c[0]));x<=Math.max(a[0],b[0],c[0]);x++){
  const s1=e(a,b,x+.5,y+.5),s2=e(b,c,x+.5,y+.5),s3=e(c,a,x+.5,y+.5);if(s1>=0&&s2>=0&&s3>=0||s1<=0&&s2<=0&&s3<=0)ps(S,x,y,col)}}
// 3x5 bitmap font
const FONT={};'0111101101101111,1010110010010111,2111001111100111,3111001111001111,4101101111001001,5111100111001111,6111100111101111,7111001001010010,8111101111101111,9111101111001111,A010101111101101,B110101110101110,C011100100100011,D110101101101110,E111100110100111,F111100110100100,G011100101101011,H101101111101101,I111010010010111,J001001001101010,K101101110101101,L100100100100111,M101111111101101,N110101101101101,O010101101101010,P110101110100100,Q010101101110011,R110101110101101,S011100010001110,T111010010010010,U101101101101111,V101101101101010,W101101111111101,X101101010101101,Y101101010010010,Z111001010100111,:000010000010000,.000000000000010,/001001010100100,-000000111000000,+000010111010000,!010010010000010'.split(',').forEach(g=>FONT[g[0]]=g.slice(1));
const SHADOW=rgba(8,18,40,255);
function tx(S,s,x,y,c,k=1,sh=SHADOW){s=(''+s).toUpperCase();const o=Math.max(1,k>>1);
 for(const[col,d]of sh?[[sh,o],[c,0]]:[[c,0]])for(let n=0;n<s.length;n++){const g=FONT[s[n]];if(g)for(let b=0;b<15;b++)if(g[b]=='1')rf(S,x+n*4*k+b%3*k+d,y+(b/3|0)*k+d,k,k,col)}}
const tw=(s,k=1)=>(''+s).length*4*k-k,ctext=(s,y,c,k=1)=>tx(HUD,s,W2-tw(s,k)/2|0,y,c,k);

// ---------- palette
const WHT=hx('ffffff'),TEAL=hx('2ee6c8'),ORG=hx('ff5a36'),YEL=hx('ffd23f'),RED=hx('ff3b30'),GRN=hx('34c759'),NAVY=hx('16213a');
const FOG=hx('cdeefd'),SKY=hx('3a8be6'),PAN=rgba(14,26,52,170);

// ---------- world: buoy circuit first, islands kept clear of it
const BU=[];for(let k=0;k<10;k++){const a=k/10*TAU-PI/2,r=k%2?318:196;BU.push({x:512+Math.cos(a)*r,y:512+Math.sin(a)*r,done:0})}
// each buoy point becomes a gate across the course (perpendicular to the corner bisector) with a 27x7 voxel banner
const GW=9;BU.forEach((b,k)=>{const p=BU[(k+9)%10],n=BU[(k+1)%10],a=Math.hypot(b.x-p.x,b.y-p.y),c=Math.hypot(n.x-b.x,n.y-b.y),dx=(b.x-p.x)/a+(n.x-b.x)/c,dy=(b.y-p.y)/a+(n.y-b.y)/c,l=Math.hypot(dx,dy);
 b.dx=dx/l;b.dy=dy/l;b.rx=-b.dy;b.ry=b.dx;
 const s=k?'GATE '+k:'FINISH',m=b.ban=new Uint8Array(189),x0=14-(s.length*4-1)/2|0;
 for(let r=0;r<7;r++)for(let c=0;c<27;c++)m[r*27+c]=r==0||r==6||c==0||c==26?2+((r+c)&1):0;
 for(let j=0;j<s.length;j++){const g=FONT[s[j]];if(g)for(let i=0;i<15;i++)if(g[i]=='1')m[(1+(i/3|0))*27+x0+j*4+i%3]=1}});
function segD(px,py,a,b){const dx=b.x-a.x,dy=b.y-a.y,t=cl(((px-a.x)*dx+(py-a.y)*dy)/(dx*dx+dy*dy),0,1);return Math.hypot(px-a.x-dx*t,py-a.y-dy*t)}
const pathD=(x,y)=>{let m=1e9;for(let k=0;k<10;k++)m=Math.min(m,segD(x,y,BU[k],BU[(k+1)%10]));return m};
const IS=[{x:512,y:512,r:105,h:58}];
for(let n=0;n<800&&IS.length<16;n++){const r=22+rnd()*50,x=110+rnd()*804,y=110+rnd()*804;
 if(pathD(x,y)<r+34||IS.some(o=>Math.hypot(o.x-x,o.y-y)<(o.r+r)*1.05))continue;IS.push({x,y,r,h:r*.55+8+rnd()*22})}

const NN=N*N,T=new Float32Array(NN),NZ=new Float32Array(NN),CM=new Uint32Array(NN),SH=new Uint8Array(NN),FT=new Float32Array(NN).fill(-99),CLD=new Uint8Array(NN);
for(let i=0;i<NN;i++)NZ[i]=fbm(i&M,i>>10,5,1/64);
const nz=(x,y)=>NZ[(y&M)<<10|(x&M)];
const E=new Float32Array(NN).fill(-.6),EI=new Uint8Array(NN),LIM=new Float32Array(NN).fill(999);
IS.forEach((o,k)=>{const R=o.r*1.6;for(let y=Math.max(0,o.y-R|0);y<Math.min(N,o.y+R);y++)for(let x=Math.max(0,o.x-R|0);x<Math.min(N,o.x+R);x++){
 const i=y<<10|x,e=1-Math.hypot(x-o.x,y-o.y)/o.r;if(e>E[i]){E[i]=e;EI[i]=k}}});
// carve a navigable channel along the circuit
for(let k=0;k<10;k++){const a=BU[k],b=BU[(k+1)%10],L=Math.hypot(b.x-a.x,b.y-a.y);for(let s=0;s<=L;s+=2){const cx=lerp(a.x,b.x,s/L),cy=lerp(a.y,b.y,s/L);
 for(let dy=-26;dy<=26;dy++)for(let dx=-26;dx<=26;dx++){const d=Math.hypot(dx,dy);if(d>26)continue;const i=((cy+dy)&M)<<10|((cx+dx)&M);LIM[i]=Math.min(LIM[i],WL-3+Math.max(0,d-16)*.9)}}}
for(let i=0;i<NN;i++){const x=i&M,y=i>>10,n=NZ[i],e=E[i]+(n-.5)*.5,fl=WL-26+n*10;let t;
 if(e<0){t=fl;const n2=nz(x*3+411,y*3+97);if(n2>.64)t=Math.max(t,WL-1.6-(.74-n2)*40)}
 else if(e<.22)t=lerp(fl,WL+.5,ss(e/.22));
 else t=WL+.5+Math.pow(e-.22,1.5)*IS[EI[i]].h*(.5+nz(x*2+77,y*2+33)*1.1);
 T[i]=Math.min(t,LIM[i])}
const tAt=(x,y)=>T[(Math.floor(y)&M)<<10|(Math.floor(x)&M)];
// self-check: every leg of the circuit is open deep water
for(let k=0;k<10;k++)for(let s=0;s<=1;s+=.01)console.assert(tAt(lerp(BU[k].x,BU[(k+1)%10].x,s),lerp(BU[k].y,BU[(k+1)%10].y,s))<WL-2,'circuit blocked at leg '+k);

const WCOL=[[0,'b5fbe9'],[1,'6eecd9'],[2.6,'33d1dc'],[6,'1aa6e0'],[12,'157dd4'],[24,'1158b8']].map(a=>[a[0],hx(a[1])]);
const wcol=d=>{for(let k=1;k<6;k++)if(d<WCOL[k][0])return mixc(WCOL[k-1][1],WCOL[k][1],(d-WCOL[k-1][0])/(WCOL[k][0]-WCOL[k-1][0]));return WCOL[5][1]};
{const SAND=hx('f6df95'),WETS=hx('dcc27c'),G1=hx('86dd52'),G2=hx('2d9c3e'),G3=hx('1d7a36'),RK=hx('a08f76');
for(let i=0;i<NN;i++){const x=i&M,y=i>>10,t=T[i],d=t-WL,n=NZ[i];
 if(d<0){CM[i]=wcol(-d);if(d>-1.3)SH[i]=(1+d/1.3)*255;continue}
 const c=d<.4?WETS:d<2?SAND:d<3.2?mixc(SAND,G1,(d-2)/1.2):d<24?mixc(mixc(G1,G2,cl(n*2-.5,0,1)),G3,cl((d-8)/16,0,1)):d<34?mixc(G3,RK,(d-24)/10):RK;
 CM[i]=shd(c,cl(1+(t-T[((y-1)&M)<<10|((x-1)&M)])*.11,.62,1.3)*(.94+hs(x,y)*.12))}}

// ---------- sprites
const BRN=hx('8a5a2b'),BRN2=hx('6b4220'),PG1=hx('46c93c'),PG2=hx('2a9a33'),PG3=hx('1b6e2a');
function mkPalm(lean){const S=mkS(26,34),bx=13-lean*2,tx_=13+lean*5,ty=10;
 for(let k=0;k<=24;k++){const t=k/24;dc(S,lerp(bx,lerp(bx,tx_,t),t),lerp(lerp(33,20,t),lerp(20,ty,t),t),1.6-t*.5,k%3?BRN:BRN2)}
 for(let f=0;f<7;f++){const a=PI+f/6*PI+(rnd()-.5)*.3,L=8+rnd()*4;
  for(let k=0;k<=14;k++){const s=k/14,x=tx_+Math.cos(a)*s*L,y=ty+Math.sin(a)*s*L*.6+s*s*7;dc(S,x,y+.7,(1-s)*1.4+.2,PG3);dc(S,x,y,(1-s)*1.3+.2,s<.5?PG1:PG2)}}
 dc(S,tx_-1,ty+1,1,BRN2);dc(S,tx_+1.5,ty+1.5,1,BRN2);return S}
const PSPR=[-1,-.4,.4,1].map(mkPalm);
const MK=mkS(5,8);for(let y=0;y<8;y++)for(let x=0;x<5;x++)if(Math.abs(x-2)<=y/3)ps(MK,x,y,y==3||y==4?WHT:ORG);
function mkCloud(P){const S=mkS(84,40),c=[WHT,hx('eaf3ff'),hx('cadcf3'),hx('aec5e7')];P.forEach(q=>q.vy=40-q.r*.75-rnd()*4);
 for(let y=0;y<40;y++)for(let x=0;x<84;x++){let b=-1,q0;for(const q of P){const d=1-Math.hypot(x-42-q.dx,y-q.vy)/q.r;if(d>b){b=d;q0=q}}
  if(b<0)continue;const s=(y-q0.vy)/q0.r*.8+(x-42-q0.dx)/q0.r*.35;S.b[y*84+x]=y>36?c[3]:s>.45?c[2]:s>.05?c[1]:c[0]}return S}
const CL=[];for(let k=0;k<26;k++){const c={x:rnd()*N,y:rnd()*N,z:WL+58+rnd()*26,p:[]},n=4+rnd()*4|0;
 for(let j=0;j<n;j++)c.p.push({dx:(rnd()-.5)*50,dy:(rnd()-.5)*24,r:7+rnd()*11});
 for(const q of c.p){const R=q.r|0;for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){const X=c.x+q.dx+dx,Y=c.y+q.dy+dy,d=Math.hypot(dx,dy)/q.r*(.75+nz(X*5,Y*5)*.5);if(d>1)continue;
  const i=(Y&M)<<10|(X&M);CLD[i]=Math.max(CLD[i],Math.min(255,(1-d)*700))}}
 c.s=mkCloud(c.p);CL.push(c)}
const PALMS=[];for(let n=0;n<60000&&PALMS.length<700;n++){const x=rnd()*N|0,y=rnd()*N|0,i=y<<10|x,d=T[i]-WL;
 if(d<1.3||d>11||Math.abs(T[i]-tAt(x,y+2))>1.6||NZ[i]<.47&&rnd()<.7)continue;PALMS.push({x:x+.5,y:y+.5,z:T[i],v:n%4})}

// ---------- the jet ski + rider as a voxel model (x fwd, y right, z up)
const VS=.18,VOX=[],V=(x,y,z,c)=>VOX.push(x,y,z,c);
{const HU=hx('f4f6f8'),HU2=hx('cfd6e0'),BOT=hx('203252'),SEAT=hx('1d2438'),CW2=hx('ff8a5c'),GL=hx('2b4f7a'),BAR=hx('333845'),GRIP=hx('15171d'),VE=hx('ffd23f'),SK=hx('f1b48c'),CAP=hx('19c3b0'),SHO=hx('2c3e9a'),SUN=hx('111111');
 for(let x=-10;x<=10;x++){const hw=x<5?4:Math.round((10-x)*.8),zb=x>4?Math.round((x-4)*.5):0;
  for(let y=-hw;y<=hw;y++)for(let z=zb;z<=3;z++){const ay=Math.abs(y);if(ay<hw&&z>zb&&z<3&&x>-10)continue;V(x,y,z,z==zb?BOT:z==zb+1&&z<3?ORG:ay==hw?HU2:HU)}}
 for(let x=-8;x<=-1;x++)for(let y=-2;y<=2;y++){V(x,y,4,SEAT);if(x<-4&&Math.abs(y)<2)V(x,y,5,SEAT)}
 for(let x=1;x<=7;x++){const w=x<5?3:7-x;for(let y=-w;y<=w;y++){V(x,y,4,ORG);if(Math.abs(y)<w&&x<7)V(x,y,5,CW2)}}
 for(let y=-2;y<=2;y++){V(3,y,6,GL);V(3,y,7,GL)}
 V(1,0,5,BAR);V(1,0,6,BAR);for(let y=-5;y<=5;y++)V(1,y,7,Math.abs(y)>3?GRIP:BAR);
 for(let x=-4;x<=0;x++)for(const y of[-2,-1,1,2])V(x,y,6,SHO);
 for(const y of[-3,3]){V(0,y,5,SHO);V(1,y,4,SK)}
 for(let x=-5;x<=-3;x++)for(let y=-2;y<=2;y++)for(let z=7;z<=11;z++)if(x!=-4||Math.abs(y)==2||z==11)V(x,y,z,VE);
 V(-4,0,12,SK);
 for(let dx=-2;dx<=2;dx++)for(let dy=-2;dy<=2;dy++)for(let dz=-2;dz<=2;dz++){const d=Math.hypot(dx,dy,dz);if(d>1.8||d<.9)continue;V(-4+dx,dy,13.5+dz|0,dz>=1?CAP:dx>=1&&dz>=0?SUN:SK)}
 for(let y=-1;y<=1;y++)V(-2,y,14,CAP);
 for(const sy of[-1,1])for(let k=0;k<=6;k++){const t=k/6;V(Math.round(lerp(-4,1,t)),Math.round(lerp(3,4.5,t))*sy,Math.round(lerp(10,7.5,t)),k<2?VE:SK)}}

// ---------- state
const K={};let mxs=0,mOn=false,mDown=false,mRt=false,started=false,auto=true,cam=0,gt=0,lapT=0,nextB=1,lastB=0,msg='',msg2='',msgC=0,msgT=0,shake=0,bfx=0,best=0,cd=-1,lapN=1,splits=[],bSplits=[],noseOn=false,lapDone=0;
const DROPS=[],say=(a,b='',c=WHT,t=1)=>{msg=a;msg2=b;msgC=c;msgT=t};
try{best=+localStorage.getItem('tiderunner.best')||0}catch(e){}
const sk={x:0,y:0,z:WL,a:0,vx:0,vy:0,vz:0,air:0,roll:0,pitch:0,steer:0,fuel:100,bo:0,camA:0,rx:0,ry:0,shal:0};
const P=[];
const A1=.8,A2=.55,V1=245,V2=-180;
let KB=90,KN=90,DMP=7,NK=9; // buoyancy spring, nose-up spring, damping, nose-up kick
let T1=0,T2=0,WX=0,WY=0,O1=0,O2=0,TH=.8,F=W2/TH;
const SN=new Float32Array(1024),CS=new Float32Array(1024);for(let i=0;i<1024;i++){SN[i]=Math.sin(i/1024*TAU);CS[i]=Math.cos(i/1024*TAU)}
const WT=new Int8Array(4096);for(let i=0;i<4096;i++){const x=i&63,y=i>>6;WT[i]=Math.round(Math.sin(TAU*(x*3+y*2)/64)*6+Math.sin(TAU*(y*5-x*2)/64)*5+(hs(x,y)-.5)*8)}
const surf=(x,y,t)=>WL+Math.sin(TAU*(x*32+t*V1)/1024)*A1+Math.sin(TAU*(x*19+y*25+t*V2)/1024)*A2;
function place(k){const a=BU[k],b=BU[(k+1)%10];Object.assign(sk,{x:a.x,y:a.y,z:WL,vx:0,vy:0,vz:0,air:0,a:Math.atan2(b.y-a.y,b.x-a.x)});sk.camA=sk.a;sk.rx=sk.x;sk.ry=sk.y;sk.gside=-1;sk.z=sk.ps=surf(sk.x,sk.y,gt)}
function begin(){started=true;auto=false;lapT=0;nextB=1;lastB=0;lapN=1;splits=[];cd=3;msgT=0;sk.fuel=100;BU.forEach(b=>b.done=0);place(0);nudge(-15);P.length=0}
const nudge=d=>{sk.x+=Math.cos(sk.a)*d;sk.y+=Math.sin(sk.a)*d;sk.rx=sk.x;sk.ry=sk.y};
place(0);nudge(60);
const fmt=t=>{const m=t/60|0,s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(1)};
function addP(x,y,z,vx,vy,vz,l){if(P.length<600)P.push({x,y,z,vx,vy,vz,l})}
function splash(n){for(let k=0;k<n;k++){const a=rnd()*TAU,s=2+rnd()*5;addP(sk.x,sk.y,sk.z+.2,Math.cos(a)*s+sk.vx*.3,Math.sin(a)*s+sk.vy*.3,3+rnd()*5,.4+rnd()*.5)}}

// ---------- simulation
function step(dt){
 gt+=dt;if(cd>-1)cd-=dt;if(cd>0)return;if(started)lapT+=dt;
 let st=0,thr=1,bo=false,nose=false;
